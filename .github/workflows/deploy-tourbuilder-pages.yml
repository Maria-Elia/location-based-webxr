name: Deploy TourBuilder to GitHub Pages

# TourBuilder (GpsPlusSlamJs_TourBuilder/) is deliberately kept out of the
# root `build:site` / Cloudflare deploy (see CLAUDE.md) while the lab work is
# still isolated. This is a separate, TourBuilder-only deploy to GitHub
# Pages so the app + component demos are reachable at a public URL without
# a phone.
#
# One-time manual step: in the repo's Settings → Pages, set "Source" to
# "GitHub Actions". After that this workflow deploys on every push to main
# that touches TourBuilder (or can be run manually from the Actions tab).

on:
  push:
    branches: [main]
    paths:
      - "GpsPlusSlamJs_TourBuilder/**"
      - "GpsPlusSlamJs_AppFramework/**"
      - ".github/workflows/deploy-tourbuilder-pages.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "24"
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      - name: Build framework
        run: pnpm run build:framework

      - name: Typecheck TourBuilder
        working-directory: GpsPlusSlamJs_TourBuilder
        run: pnpm exec tsc -p tsconfig.app.json --noEmit

      - name: Build TourBuilder
        # Base is "/": Pages serves this at the custom domain root
        # (tourbuilder.mariaelia.de), not a project-site subpath. See the
        # public/CNAME file that pins the domain for Actions-based deploys.
        working-directory: GpsPlusSlamJs_TourBuilder
        run: pnpm exec vite build --base=/

      - name: Promote the composed app to the Pages root
        # The build's default root index.html is the component gallery
        # (dist/index.html), with the composed app at dist/src/app/index.html.
        # For the deployed site the composed app (Goal 2 — the actual
        # Authoring/Viewing app) should be what loads at the site root; the
        # gallery moves to /gallery/ so the component demos stay reachable.
        # Vite already rewrote every asset href/src to base-prefixed absolute
        # URLs at build time, so moving the HTML files is safe.
        working-directory: GpsPlusSlamJs_TourBuilder/dist
        run: |
          mkdir -p gallery
          mv index.html gallery/index.html
          mv src/app/index.html index.html

      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: GpsPlusSlamJs_TourBuilder/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
