<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>gps-plus-slam — onboarding gate demo</title>
    <link rel="stylesheet" href="../shared/demo.css" />
    <style>
      /* Override shared demo.css: that stylesheet assumes a full-bleed
         #canvas-root Three.js scene behind a floating #hud overlay. This
         demo has no canvas — it's a plain scrolling DOM page.
         `html` too — on mobile browsers it's `html`'s overflow that
         actually gates touch scrolling, not just `body`'s. */
      html,
      body {
        overflow: auto;
      }
      #hud {
        position: static;
        max-width: 640px;
        margin: 24px auto 0;
        pointer-events: auto;
      }
      #gate-root {
        display: grid;
        gap: 12px;
        max-width: 420px;
        margin: 32px auto;
        padding: 20px;
        background: rgb(255 255 255 / 3%);
        border: 1px solid #2a3550;
        border-radius: 10px;
      }
      #gate-root button {
        padding: 10px 16px;
        font-size: 15px;
      }
      #state-log {
        max-width: 420px;
        margin: 0 auto;
        font-size: 12px;
        white-space: pre-wrap;
        color: #9aa7bd;
      }
    </style>
  </head>
  <body>
    <section id="hud">
      <h1>Component 9 — Onboarding gate demo</h1>
      <p>
        Click <strong>Grant Access</strong> to request camera and GPS permission
        — this uses the real browser prompts, one after another. Start stays
        disabled until the browser itself reports both as granted. Clicking
        <strong>Start</strong> unlocks the Web Audio API and plays a short
        confirmation beep.
      </p>
      <p id="status"></p>
    </section>
    <div id="gate-root"></div>
    <pre id="state-log"></pre>
    <script type="module" src="./demo.ts"></script>
  </body>
</html>
