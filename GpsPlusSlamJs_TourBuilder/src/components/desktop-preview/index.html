<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>gps-plus-slam — desktop preview (Component 11)</title>
    <link rel="stylesheet" href="../shared/demo.css" />
    <style>
      #canvas-root canvas {
        display: block;
        width: 100%;
        height: 100%;
        cursor: grab;
      }

      #canvas-root canvas:active {
        cursor: grabbing;
      }

      #intro {
        position: absolute;
        top: 12px;
        left: 12px;
        margin: 0;
        padding: 12px 14px;
        max-width: 340px;
        background: rgb(0 0 0 / 55%);
        border: 1px solid #2a3550;
        border-radius: 10px;
        font-size: 13px;
        line-height: 1.5;
      }

      #intro h1 {
        margin: 0 0 6px;
        font-size: 15px;
      }

      #intro p {
        margin: 0;
      }

      #controls {
        position: absolute;
        left: 12px;
        bottom: 12px;
        display: flex;
        gap: 10px;
        padding: 10px 12px;
        background: rgb(0 0 0 / 60%);
        border: 1px solid #2a3550;
        border-radius: 10px;
        font-size: 13px;
      }

      #controls button {
        font: inherit;
        font-size: 13px;
        color: #e9eef7;
        background: rgb(79 140 255 / 18%);
        border: 1px solid #3d5488;
        border-radius: 8px;
        padding: 6px 12px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div id="canvas-root"></div>

    <section id="intro">
      <h1>Desktop preview</h1>
      <p>
        Walks a real tour with no phone, GPS, or WebXR. Component 8's AR viewing
        scene runs unchanged inside a stand-in for the AR session.
      </p>
    </section>

    <div id="controls">
      <button id="start" type="button">▶ Start</button>
      <button id="autopilot" type="button">Auto-walk</button>
    </div>

    <p id="status"></p>

    <script type="module" src="./demo.ts"></script>
  </body>
</html>
